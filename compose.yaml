name: mtt-harness

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${MTT_DB_USER:-mtt}
      POSTGRES_PASSWORD: ${MTT_DB_PASSWORD:-mtt}
      POSTGRES_DB: ${MTT_DB_NAME:-mtt}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MTT_DB_USER:-mtt}"]
      interval: 2s
      timeout: 3s
      retries: 30

  mtt:
    init: true
    build: .
    user: "${MTT_UID:-1000}:${MTT_GID:-1000}"
    # Compose reads this benchmark switch from the local .env file.
    environment:
      MTT_READ_LINE_NUMBERS: ${MTT_READ_LINE_NUMBERS:-false}
    command:
      - --config
      - /etc/mtt/mtt.json
      - --providers-file
      - /etc/mtt/providers.json
      - --mcp-file
      - /etc/mtt/mcp.json
      - --start-prompt-file
      - /etc/mtt/start_prompt.md
      - --database-url
      - postgres://${MTT_DB_USER:-mtt}:${MTT_DB_PASSWORD:-mtt}@postgres:5432/${MTT_DB_NAME:-mtt}?sslmode=disable
      - --port
      - "8080"
      - --test-provider=${MTT_TEST_PROVIDER:-true}
    ports:
      - "${MTT_HOST_PORT:-18080}:8080"
    volumes:
      - type: bind
        source: ./workspace
        target: /workspace
        bind:
          create_host_path: false
      - type: bind
        source: ./mtt.json
        target: /etc/mtt/mtt.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./providers.json
        target: /etc/mtt/providers.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./mcp.json
        target: /etc/mtt/mcp.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./start_prompt.md
        target: /etc/mtt/start_prompt.md
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  postgres-test:
    profiles: ["test"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mtt
      POSTGRES_PASSWORD: mtt
      POSTGRES_DB: mtt_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtt -d mtt_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  test:
    init: true
    profiles: ["test"]
    build:
      context: .
      target: builder
    environment:
      CGO_ENABLED: "0"
      MTT_TEST_DATABASE_URL: postgres://mtt:mtt@postgres-test:5432/mtt_test?sslmode=disable
      MTT_TEST_SEARCH_MODEL_DIRECTORY: /opt/mtt/models/all-MiniLM-L6-v2
    command: ["go", "test", "-tags", "semantic", "./..."]
    depends_on:
      postgres-test:
        condition: service_healthy

volumes:
  pgdata:

networks:
  default:
    ipam:
      config:
        - subnet: ${MTT_DOCKER_SUBNET:-172.16.0.0/24}
