name: mtt-harness-ui

services:
  ui:
    build:
      context: .
    init: true
    ports:
      - "${UI_BIND_ADDRESS:-0.0.0.0}:${UI_PORT:-18081}:8080"
    environment:
      HARNESS_UPSTREAM: ${HARNESS_UPSTREAM:-http://host.docker.internal:18080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: ${UI_DOCKER_SUBNET:-172.16.1.0/24}
